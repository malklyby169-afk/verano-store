<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉRANO Technology Studio</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0D0D0D;
color:#FFFFFF;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.container{
padding:20px;
}

.logo{
font-size:4rem;
font-weight:700;
letter-spacing:8px;
color:#D4AF37;
margin-bottom:15px;
}

.subtitle{
font-size:1.4rem;
color:#FFFFFF;
margin-bottom:8px;
}

.description{
font-size:1rem;
color:#CFCFCF;
margin-bottom:50px;
}

.soon{
font-size:3rem;
font-weight:bold;
color:#D4AF37;
letter-spacing:12px;
text-transform:uppercase;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{opacity:0.5;transform:scale(1);}
50%{opacity:1;transform:scale(1.08);}
100%{opacity:0.5;transform:scale(1);}
}

.arabic{
margin-top:12px;
font-size:1rem;
color:#AFAFAF;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">VÉRANO</div>

<div class="subtitle">
Technology Studio
</div>

<div class="description">
Premium Web Design & IT Solutions
</div>

<div class="soon">
SOON
</div>

<div class="arabic">
قريبــــاً
</div>

</div>

</body>
</html>
