<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
}

body{
background: radial-gradient(circle at top, #111 0%, #000 100%);
color:#fff;
line-height:1.6;
}

/* HEADER */
header{
text-align:center;
padding:100px 20px;
}

.logo{
font-size:4.5rem;
font-weight:800;
letter-spacing:10px;
color:#D4AF37;
text-shadow:0 0 20px rgba(212,175,55,0.4);
}

.subtitle{
font-size:1.6rem;
margin-top:10px;
color:#ddd;
}

.description{
color:#aaa;
margin-top:10px;
font-size:1rem;
}

.soon{
margin-top:50px;
font-size:3.5rem;
font-weight:bold;
color:#D4AF37;
animation:pulse 2s infinite;
text-shadow:0 0 20px rgba(212,175,55,0.5);
}

@keyframes pulse{
0%{opacity:.4; transform:scale(0.98);}
50%{opacity:1; transform:scale(1.02);}
100%{opacity:.4; transform:scale(0.98);}
}

/* SECTIONS */
.section{
padding:80px 20px;
max-width:1100px;
margin:auto;
}

.section-title{
text-align:center;
font-size:2.2rem;
color:#D4AF37;
margin-bottom:40px;
letter-spacing:2px;
}

/* CARDS */
.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:25px;
}

.card{
background: rgba(255,255,255,0.03);
backdrop-filter: blur(10px);
padding:30px;
border-radius:18px;
text-align:center;
border:1px solid rgba(212,175,55,0.15);
transition:0.3s ease;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.card:hover{
transform:translateY(-8px);
border:1px solid rgba(212,175,55,0.6);
box-shadow:0 10px 30px rgba(212,175,55,0.2);
}

.card h3{
color:#D4AF37;
margin-bottom:10px;
}

/* ABOUT */
.about{
text-align:center;
color:#ccc;
max-width:750px;
margin:auto;
font-size:1.05rem;
}

/* WHATSAPP BUTTON */
.whatsapp{
display:flex;
justify-content:center;
margin-top:40px;
}

.whatsapp a{
background:linear-gradient(135deg,#D4AF37,#b8912f);
color:#000;
padding:16px 35px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
font-size:18px;
transition:0.3s;
box-shadow:0 0 20px rgba(212,175,55,0.3);
}

.whatsapp a:hover{
transform:scale(1.05);
box-shadow:0 0 30px rgba(212,175,55,0.6);
}

/* CONTACT */
.contact-links a{
color:#D4AF37;
text-decoration:none;
}

footer{
text-align:center;
padding:40px;
color:#777;
border-top:1px solid #222;
margin-top:60px;
}
</style>
