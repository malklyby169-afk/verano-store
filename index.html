<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0D0D0D;
color:#fff;
line-height:1.6;
}

/* HEADER */
header{
text-align:center;
padding:80px 20px;
}

.logo{
font-size:4rem;
font-weight:bold;
letter-spacing:8px;
color:#D4AF37;
text-shadow:0 0 15px rgba(212,175,55,0.3);
}

.subtitle{
font-size:1.5rem;
margin-top:10px;
}

.description{
color:#cfcfcf;
margin-top:10px;
}

.soon{
margin-top:40px;
font-size:3rem;
font-weight:bold;
color:#D4AF37;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{opacity:.5;}
50%{opacity:1;}
100%{opacity:.5;}
}

/* SECTIONS */
.section{
padding:60px 20px;
max-width:1000px;
margin:auto;
}

.section-title{
text-align:center;
font-size:2rem;
color:#D4AF37;
margin-bottom:30px;
}

/* CARDS (تحسين خفيف بدون كسر) */
.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#161616;
padding:25px;
border-radius:15px;
text-align:center;
border:1px solid #222;
transition:0.3s ease;
}

.card:hover{
transform:translateY(-5px);
border-color:#D4AF37;
box-shadow:0 5px 20px rgba(212,175,55,0.15);
}

.card h3{
color:#D4AF37;
margin-bottom:10px;
}

/* ABOUT */
.about{
text-align:center;
color:#ddd;
max-width:700px;
margin:auto;
}

/* WHATSAPP */
.whatsapp{
display:flex;
justify-content:center;
margin-top:40px;
}

.whatsapp a{
background:#D4AF37;
color:#000;
padding:15px 30px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
font-size:18px;
transition:0.3s;
}

.whatsapp a:hover{
transform:scale(1.05);
}

/* CONTACT */
.contact-links a{
color:#D4AF37;
text-decoration:none;
}

footer{
text-align:center;
padding:30px;
color:#888;
border-top:1px solid #222;
margin-top:50px;
}
</style>
