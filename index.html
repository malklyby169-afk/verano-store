<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉRANO Tech</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0D0D0D;
color:#FFFFFF;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}

.container{
padding:20px;
max-width:800px;
}

.logo{
font-size:4rem;
font-weight:700;
letter-spacing:8px;
color:#D4AF37;
margin-bottom:10px;
}

.subtitle{
font-size:1.8rem;
font-weight:600;
color:#FFFFFF;
margin-bottom:10px;
}

.description{
font-size:1rem;
color:#CFCFCF;
margin-bottom:50px;
}

.soon{
font-size:4rem;
font-weight:bold;
color:#D4AF37;
letter-spacing:15px;
animation:pulse 2s infinite;
}

.arabic{
margin-top:15px;
font-size:1.2rem;
color:#BDBDBD;
}

@keyframes pulse{
0%{
opacity:.5;
transform:scale(1);
}
50%{
opacity:1;
transform:scale(1.08);
}
100%{
opacity:.5;
transform:scale(1);
}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">VÉRANO</div>

<div class="subtitle">
Tech
</div>

<div class="description">
Premium Web Design & IT Solutions
</div>

<div class="soon">
SOON
</div>

<div class="arabic">
قريبــــاً
</div>

</div>

</body>
</html>
