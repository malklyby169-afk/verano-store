<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉRANO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0D0D0D;
color:white;
}

header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.logo{
font-size:32px;
font-weight:bold;
color:#D4AF37;
}

.hero{
height:70vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:50px;
color:#D4AF37;
}

.hero p{
margin-top:10px;
font-size:20px;
color:#ddd;
}

.btn{
margin-top:25px;
background:#D4AF37;
color:black;
padding:14px 28px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.products{
padding:40px 20px;
}

.products h2{
text-align:center;
margin-bottom:30px;
color:#D4AF37;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:#161616;
padding:15px;
border-radius:15px;
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

.price{
color:#D4AF37;
margin-top:10px;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<div class="logo">VÉRANO</div>
<div>Timeless Elegance</div>
</header>

<section class="hero">
<h1>VÉRANO</h1>
<p>أناقة خالدة لعشاق الفخامة</p>
<a href="#" class="btn">تسوق الآن</a>
</section>

<section class="products">
<h2>المنتجات المميزة</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600" alt="">
<h3>قميص فاخر</h3>
<div class="price">15 ر.ع</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=600" alt="">
<h3>جاكيت أنيق</h3>
<div class="price">35 ر.ع</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=600" alt="">
<h3>طقم عصري</h3>
<div class="price">25 ر.ع</div>
</div>

</div>
</section>

</body>
</html>
